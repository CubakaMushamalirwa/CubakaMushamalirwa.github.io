<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cubaka Mushamalirwa Christophe">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Cubaka Mushamalirwa Christophe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Hide Flutter canvas until engine is ready */
    #flutter_container {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>
  <div id="loader"></div>

  <div id="flutter_container"></div>

  <script>
    fetch('loading.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('loader').innerHTML = html;
      });

    // STEP 2: Listen for when Flutter finishes its first frame
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loader');
      const flutterContainer = document.getElementById('flutter_container');

      if (loader) {
        loader.style.transition = 'opacity 0.6s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 600);
      }

      if (flutterContainer) {
        flutterContainer.style.opacity = '1';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
