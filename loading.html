<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubaka Mushamalirwa Christophe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat Alternates', sans-serif;
      background: #0B0B0B;
      color: #FFFFFF;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .loading-container {
      text-align: center;
      z-index: 10;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      position: relative;
    }

    .logo-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite alternate;
    }

    .logo-inner {
      width: 60%;
      height: 60%;
      background: #0B0B0B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #667EEA;
    }

    .loading-text {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 16px;
      color: #94A3B8;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin: 0 auto;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667EEA 0%, #764BA2 100%);
      border-radius: 2px;
      animation: loading 2s ease-in-out infinite;
      transform-origin: left;
    }

    .floating-elements {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-element {
      position: absolute;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
    }

    .element-1 {
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .element-2 {
      top: 60%;
      right: 15%;
      animation-delay: 1s;
    }

    .element-3 {
      bottom: 30%;
      left: 20%;
      animation-delay: 2s;
    }

    .element-4 {
      top: 40%;
      right: 25%;
      animation-delay: 3s;
    }

    .tech-stack {
      margin-top: 30px;
      font-size: 14px;
      color: #64748B;
    }

    .tech-item {
      display: inline-block;
      margin: 0 8px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
      }

      100% {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
      }
    }

    @keyframes loading {
      0% {
        transform: scaleX(0);
        transform-origin: left;
      }

      50% {
        transform: scaleX(1);
        transform-origin: left;
      }

      100% {
        transform: scaleX(0);
        transform-origin: right;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .loading-text {
        font-size: 20px;
      }

      .subtitle {
        font-size: 14px;
      }

      .logo {
        width: 60px;
        height: 60px;
      }
    }

    /* Dark/Light mode support */
    @media (prefers-color-scheme: light) {
      body {
        background: #FFFFFF;
        color: #0B0B0B;
      }

      .logo-circle {
        background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      }

      .logo-inner {
        background: #FFFFFF;
        color: #4F46E5;
      }

      .loading-text {
        background: linear-gradient(135deg, #0B0B0B 0%, #374151 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: #6B7280;
      }

      .progress-container {
        background: rgba(0, 0, 0, 0.1);
      }

      .floating-element {
        opacity: 0.05;
      }

      .tech-item {
        background: rgba(0, 0, 0, 0.05);
        border-color: rgba(0, 0, 0, 0.1);
      }
    }
  </style>
</head>

<body>
  <!-- Floating Background Elements -->
  <div class="floating-elements">
    <div class="floating-element element-1">⚡</div>
    <div class="floating-element element-2">🚀</div>
    <div class="floating-element element-3">💻</div>
    <div class="floating-element element-4">🎯</div>
  </div>

  <!-- Main Loading Content -->
  <div class="loading-container">
    <div class="logo">
      <div class="logo-circle">
        <div class="logo-inner">CM</div>
      </div>
    </div>

    <h1 class="loading-text">Cubaka Mushamalirwa Christophe</h1>
    <p class="subtitle">Software Developer</p>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="tech-stack">
      <span class="tech-item">Flutter</span>
      <span class="tech-item">Laravel</span>
      <span class="tech-item">Dart</span>
      <span class="tech-item">Firebase</span>
    </div>
  </div>

  <script>
    // Smooth loading animation
    document.addEventListener('DOMContentLoaded', function () {
      const elements = document.querySelectorAll('.floating-element');
      elements.forEach((el, index) => {
        el.style.animationDelay = (index * 0.5) + 's';
      });
    });

    // Add some interactive elements
    document.addEventListener('mousemove', function (e) {
      const floatingElements = document.querySelectorAll('.floating-element');
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;

      floatingElements.forEach((el, index) => {
        const speed = (index + 1) * 0.0002;
        const x = (mouseX - 0.5) * speed * 100;
        const y = (mouseY - 0.5) * speed * 100;
        el.style.transform += ` translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>

</html>
